<div id="guide-fragment">
<noscript><p>Search needs JavaScript. All guides are listed below.</p></noscript>
<p class="caption" data-search-summary>{{ guides|length }} guides</p><div class="cards">{% for guide in guides %}<a class="card" data-guide="{{ guide.slug }}" href="/guides/{{ guide.slug }}/"><span class="eyebrow">{{ guide.category }}</span><h2>{{ guide.title }}</h2><p>{{ guide.description }}</p><span class="card-arrow">↗</span></a>{% else %}<p>No matching guides. Try a component number or another term.</p>{% endfor %}</div><p data-search-empty hidden>No matching guides. Try a component number or another term.</p>

</div>
