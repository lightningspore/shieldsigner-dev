[package]
name = "shieldsigner-rkaiq"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
name = "shieldsigner_rkaiq"

[dependencies]
libm = "=0.2.16"
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
panic = "abort"
