[tools]
bun = "1.2.21"
uv = "0.12.7"

[tasks.setup]
description = "Install pinned JavaScript dependencies"
run = "bun install --frozen-lockfile"

[tasks.generate]
description = "Extract geometry, nets and assembly metadata from the current native KiCad board"
run = "uv run scripts/generate-reference.py"

[tasks.build]
description = "Build native PCB and attach checked reference copper"
run = "bun run build"

[tasks.check]
description = "Check PCB fidelity, assembly defaults and TypeScript"
run = ["bun run check", "bunx tsc --noEmit"]

[tasks.docs]
description = "Regenerate the component guide from reference data and authored explanations"
run = "uv run scripts/generate-component-docs.py"

[tasks.dev]
description = "Build and preview the routed tscircuit port on localhost:3020"
run = ["uv run scripts/generate-reference.py", "bun run build", "bun run dev"]

[settings]
task.run_auto_install = false

[tasks."kicad:setup"]
description = "Cache and mount KiCad 10.0.7 locally; preserves installed KiCad 9"
run = "uv run scripts/kicad.py setup"

[tasks."kicad:open"]
description = "Open the complete native KiCad project in KiCad 10"
run = "uv run scripts/kicad.py open"

[tasks."kicad:check"]
description = "Run native ERC/DRC and fail when unresolved errors remain"
run = "uv run scripts/kicad.py check"

[tasks."kicad:export"]
description = "Export native schematic PDF, PCB SVGs and netlist for review"
run = "uv run scripts/kicad.py export"

[tasks."kicad:preview"]
description = "Serve native KiCad review outputs on localhost:3021"
run = "uv run --python 3.11 python -m http.server 3021 --bind 127.0.0.1 --directory dist/kicad"

[tasks."bom:refresh"]
description = "Refresh public JLCPCB catalog identities and availability (no account writes)"
run = "uv run scripts/refresh-jlc.py"

[tasks."bom:generate"]
description = "Export native positions and generate matching JLCPCB carrier BOM/CPL"
run = ["uv run scripts/kicad.py export", "uv run scripts/generate-bom.py"]

[tasks."review:build"]
description = "Build readable local documentation and hardware-only review bundle"
run = "uv run scripts/build-review.py"

[tasks."os:build"]
description = "Try the pinned upstream Luckfox Mini microSD build (requires x86_64 Docker host)"
run = "bash scripts/build-os.sh"

[tasks."os:remote:status"]
description = "Read the ShieldSigner build status on Beelink2 container 610"
run = "bash scripts/os-remote-status.sh"

[tasks."kicad:edit"]
description = "Apply an explicit JSON layout recipe with backup and edit audit"
run = "uv run scripts/pcb-edit.py"

[tasks."kicad:fab"]
description = "Require native checks, then export Gerbers and separate PTH/NPTH drills"
run = "uv run scripts/kicad.py fabricate"

[tasks."kicad:tools:check"]
description = "Verify editor acceptance, stale-recipe rejection and bad-placement rollback"
run = "uv run scripts/verify-pcb-editor.py"

[tasks."dev:source"]
description = "Preview editable TSX without imported copper on localhost:3022"
run = "bun run dev:source"

[tasks."os:prepare"]
description = "Prepare pinned OS sources and the UR2 reader configuration; does not compile or flash"
run = "SHIELDSIGNER_PREPARE_ONLY=1 bash scripts/build-os.sh"

[tasks."bom:check"]
description = "Verify fitted passive nominal values agree with their selected catalog parts"
run = "uv run scripts/check-bom-values.py"

[tasks."variant:lcd:check"]
description = "Check and export the separate 2.8-inch header-module carrier"
run = "uv run python scripts/check-lcd-module-variant.py"

[tasks."variant:lcd:pinouts"]
description = "Audit all Luckfox/LCD pad nets, rail separation and pinned firmware assignments"
run = "uv run python scripts/audit-module-pinouts.py"

[tasks."variant:lcd:models"]
description = "Check manufacturer land patterns, mounting geometry and all portable 3D model hashes"
run = "uv run python scripts/check-modular-mechanics.py"

[tasks."variant:lcd:fab"]
description = "Build matched modular Gerbers/drills/BOM/CPL and five-board sourcing audit"
run = "uv run python scripts/manufacture-modular.py"

[tasks."variant:lcd:review"]
description = "Render the assembled modular carrier and export STEP/GLB models"
run = "uv run python scripts/render-modular.py"

[tasks."variant:lcd:open"]
description = "Open the modular carrier in pinned KiCad 10"
run = "uv run python scripts/open-modular.py"

[tasks."variant:lcd:package"]
description = "Package existing modular fabrication/review outputs and pin release checksums"
run = "uv run python scripts/package-modular.py"

[tasks."variant:lcd:display-model"]
description = "Regenerate drawing-based LCD/support envelopes and hashes; follow with review/package"
run = "uv run --python 3.11 --with cadquery==2.8.0 python scripts/model-pill-display.py"

[tasks."enclosure:build"]
description = "Render draft enclosure STL meshes and validate manifoldness, bed bounds and print Z"
run = "uv run --python 3.11 --with trimesh --with networkx --with manifold3d python enclosure/build.py"

[tasks."enclosure:fit"]
description = "Check native hardware against printed parts and export assembled/exploded GLBs (requires hardware mesh cache)"
run = ["uv run --python 3.11 --with trimesh --with networkx --with manifold3d python enclosure/check_hardware.py", "uv run --python 3.11 --with trimesh --with networkx --with manifold3d python enclosure/preview_assembly.py"]

[tasks."enclosure:verify"]
description = "Regenerate portable meshes, run fit/motion/fastener checks and slice the P1S plate"
run = "uv run --python 3.11 --with trimesh --with networkx --with manifold3d python enclosure/verify.py"

[tasks."enclosure:viewer"]
description = "Bundle the locally hosted Three.js enclosure viewer"
run = "bun build website/viewer/enclosure.js --outfile website/static/enclosure-viewer.js --minify"

[tasks."enclosure:hardware"]
description = "Generate checked hardware mesh caches from existing native STEP/GLB exports"
run = ["uv run --python 3.11 --with cadquery==2.8.0 --with trimesh python enclosure/export_hardware.py", "uv run --python 3.11 --with trimesh python enclosure/color_hardware.py"]

[tasks."telegram:sync"]
description = "Sync three configured Telegram groups into ignored private local storage"
run = "uv run tools/telegram/ingest.py"

[tasks."telegram:status"]
description = "Show private local Telegram message counts and last completed syncs"
run = "uv run python tools/telegram/status.py"

[tasks."telegram:index"]
description = "Build private full-text, topic and deduplicated source-link indexes"
run = "uv run python tools/telegram/knowledge.py build"

[tasks."telegram:search"]
description = "Search private Telegram knowledge with source references"
run = "uv run python tools/telegram/knowledge.py search"

[tasks."telegram:update"]
description = "Sequentially sync Telegram groups and rebuild the private knowledge index"
run = ["uv run tools/telegram/ingest.py", "uv run python tools/telegram/knowledge.py build"]

[tasks."bom:self-assembly"]
description = "Generate/check the separate DigiKey self-assembly sourcing overlay"
run = "uv run python scripts/generate-self-assembly.py"

[tasks."variant:lcd:first-article"]
description = "Measure native QFN stencil/via geometry and report first-article assembly process questions"
run = "uv run python scripts/audit-first-article.py"

[tasks."bom:first-article-budget"]
description = "Calculate one-article/spares/three-board parts baskets; keep missing landed costs unknown"
run = "uv run python scripts/budget-first-article.py"

[tasks."variant:lcd:bottom-quote"]
description = "Package an unsubmitted bottom-only first-article assembly option from pinned Gerbers and matched BOM/CPL"
run = "uv run python scripts/package-bottom-assembly.py"

[tasks."variant:lcd:power-budget"]
description = "Calculate LCD LDO heat sensitivity and retain first-article measurement gates"
run = "uv run python scripts/lcd-power-budget.py"

[tasks."variant:lcd:fab-audit"]
description = "Screen actual native geometry against dated JLC fabrication limits and flag assembly tooling gaps"
run = "uv run python scripts/audit-fabrication.py"

[tasks."variant:lcd:faces"]
description = "Render unobstructed high-resolution top and bottom PCB views"
run = "uv run python scripts/render-board-faces.py"

[tasks."variant:lcd:stack"]
description = "Measure exported header mating alignment, insertion and module stack geometry"
run = "uv run --python 3.11 --with trimesh --with numpy python scripts/audit-assembly-stack.py"

[tasks."variant:lcd:fit-model"]
description = "Export full case-aligned PCB STEP, standard-unit GLBs and assembled case STL fit kit"
run = "uv run --python 3.11 --with cadquery==2.8.0 --with trimesh --with manifold3d python scripts/build-fit-model.py"

[tasks."variant:lcd:printable-fit"]
description = "Create one watertight millimetre STL fit mockup and a bare carrier STL"
run = "uv run --python 3.11 --with trimesh --with manifold3d --with networkx python scripts/build-printable-fit.py"

[tasks."variant:lcd:pwm"]
description = "Build the dedicated-backlight PWM revision candidate and run native checks"
run = "uv run python scripts/build-backlight-pwm.py"

[tasks."variant:lcd:pinout-diagram"]
description = "Check public Mini pin diagram against both native revisions, pinned SDK muxes and app"
run = "uv run python scripts/audit-pinout-diagram.py"

[tasks."camera:re:prepare"]
description = "Fetch and verify pinned RKAIQ binaries and Ghidra; build Mac native decompiler if needed"
run = "uv run python reverse-engineering/rkaiq/scripts/prepare.py --ghidra"

[tasks."camera:re:analyze"]
description = "Analyze pinned ARM binaries with Ghidra and export selected numerical/daemon pseudocode"
run = "uv run python reverse-engineering/rkaiq/scripts/analyze.py"

[tasks."camera:rust:test"]
description = "Test Rust reconstruction and compare original ARM instructions with 6,050 Rust outputs"
run = ["mise exec rust@1.93.1 -- cargo test --locked --manifest-path firmware/rkaiq-rs/Cargo.toml", "mise exec rust@1.93.1 -- cargo build --locked --release --manifest-path firmware/rkaiq-rs/Cargo.toml --bin numeric-fixture", "uv run --python 3.13 --with pyelftools==0.32 --with unicorn==2.1.4 python reverse-engineering/rkaiq/scripts/differential.py --cases 1000 --emit-dir dist/reverse-engineering/fixtures"]

[tasks."camera:rust:arm"]
description = "Cross-compile standalone static ARMv7/musl camera and numerical test tools"
run = "mise exec rust@1.93.1 zig@0.15.2 -- uv run --python 3.13 --with cargo-zigbuild==0.23.0 cargo-zigbuild zigbuild --locked --release --target armv7-unknown-linux-musleabihf --manifest-path firmware/rkaiq-rs/Cargo.toml --bins"

[tasks."camera:rust:smoke"]
description = "Check static ARM tools and entire numerical corpus under Docker ARM emulation"
run = "uv run python reverse-engineering/rkaiq/scripts/arm-smoke.py"

[tasks."camera:rust:package"]
description = "Package verified ARM camera-test tools, original-reference fixtures, source and test guide"
run = ["mise exec rust@1.93.1 -- cargo build --locked --release --manifest-path firmware/rkaiq-rs/Cargo.toml --bin frame-preview", "uv run --python 3.13 --with pyelftools==0.32 python reverse-engineering/rkaiq/scripts/package.py"]
