[package]
name = "rv1103-bringup"
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace]
exclude = ["hash-core"]

[features]
cpu-base = []
gpio-test = ["cpu-base"]
i2c-test = ["cpu-base"]
spi-test = ["cpu-base"]
camera-test = ["i2c-test"]
camera-pattern = ["camera-test"]
camera-low-light = ["camera-test"]
camera-replay = ["camera-test"]
isp-test = ["camera-test", "dep:shieldsigner-rkaiq"]
isp-stats-test = ["isp-test"]
isp-3a-test = ["isp-stats-test", "shieldsigner-rkaiq/profiles", "dep:serde_json"]
reclaiming-heap = ["cpu-base", "dep:buddy_system_allocator"]
runtime-repl = ["reclaiming-heap"]
runtime-board = ["runtime-repl", "isp-3a-test", "gpio-test", "spi-test"]
fast-boot = ["runtime-board"]
# App build retains fast startup without driving a button as a timing probe.
app-runtime = ["fast-boot"]
usb-console = ["app-runtime"]
usb-only = ["usb-console"]
bench-ui = ["usb-only"]
native-ui = ["usb-console", "native-hashes"]
native-hashes = ["usb-console", "dep:shieldsigner-hash-core"]
mini-pcb-ui = ["bench-ui"]
app-ui = ["native-ui", "mini-pcb-ui"]

[dependencies]
shieldsigner-rkaiq = { path = "../firmware/rkaiq-rs", default-features = false, optional = true }
serde_json = { version = "1", default-features = false, features = ["alloc"], optional = true }
buddy_system_allocator = { version = "=0.13.0", optional = true }

shieldsigner-hash-core = { path = "hash-core", optional = true }

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
