[package]
name = "rv1103-bringup"
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace]

[features]
cpu-base = []
gpio-test = ["cpu-base"]
i2c-test = ["cpu-base"]
spi-test = ["cpu-base"]
camera-test = ["i2c-test"]
camera-pattern = ["camera-test"]
camera-low-light = ["camera-test"]
camera-replay = ["camera-test"]
isp-test = ["camera-test", "dep:shieldsigner-rkaiq"]
isp-stats-test = ["isp-test"]
isp-3a-test = ["isp-stats-test", "shieldsigner-rkaiq/profiles", "dep:serde_json"]

[dependencies]
shieldsigner-rkaiq = { path = "../firmware/rkaiq-rs", default-features = false, optional = true }
serde_json = { version = "1", default-features = false, features = ["alloc"], optional = true }

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
