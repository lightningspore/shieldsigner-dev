[tools]
bun = "1.2.21"
uv = "0.12.7"

[tasks.setup]
description = "Install pinned JavaScript dependencies"
run = "bun install --frozen-lockfile"

[tasks.generate]
description = "Extract geometry, nets and assembly metadata from the current native KiCad board"
run = ["uv run scripts/generate-reference.py --variant pill", "uv run python scripts/extract-pill-details.py", "uv run scripts/generate-reference.py --variant standard"]

[tasks.build]
description = "Build the tscircuit preview from the main native KiCad board"
run = "mise run tscircuit:pill:reference:build"

[tasks.check]
description = "Check PCB fidelity, assembly defaults and TypeScript"
run = ["mise run tasks:check", "bun run check", "bun scripts/check.tsx", "bunx tsc --noEmit"]

[tasks.docs]
description = "Check current-BOM datasheets and regenerate the module pinout audit"
run = ["uv run --with 'pypdf[crypto]' python scripts/collect-datasheets.py", "uv run python scripts/audit-module-pinouts.py"]

[tasks.dev]
description = "Build and preview the routed tscircuit port on localhost:3020"
run = "mise run tscircuit:pill:reference:dev"

[settings]
task.run_auto_install = false

[tasks."kicad:setup"]
description = "Cache and mount KiCad 10.0.7 locally; preserves installed KiCad 9"
run = "uv run scripts/kicad.py setup"

[tasks."kicad:open"]
description = "Open the complete native KiCad project in KiCad 10"
run = "uv run scripts/kicad.py open"

[tasks."kicad:check"]
description = "Run native ERC/DRC and fail when unresolved errors remain"
run = "uv run scripts/kicad.py check"

[tasks."kicad:export"]
description = "Export native schematic PDF, PCB SVGs and netlist for review"
run = "uv run scripts/kicad.py export"

[tasks."kicad:preview"]
description = "Serve native KiCad review outputs on localhost:3021"
run = "uv run --python 3.11 python -m http.server 3021 --bind 127.0.0.1 --directory dist/kicad"

[tasks."bom:refresh"]
description = "Refresh main factory-BOM catalog identities and availability; --dry-run lists codes without fetching"
run = "uv run scripts/refresh-jlc.py"

[tasks."bom:generate"]
description = "Export native positions and generate matching JLCPCB carrier BOM/CPL"
run = "mise run hardware:fab"

[tasks."review:build"]
description = "Render and package the main board review kit (requires matching hardware:fab outputs)"
run = ["mise run hardware:review", "mise run hardware:package"]

[tasks."os:build"]
description = "Build pinned Luckfox Mini microSD with Rust camera/QR runtime (x86_64 Docker host)"
run = "bash scripts/build-os.sh"

[tasks."os:remote:build"]
description = "Stage verified Rust camera runtime and launch image build on the documented Proxmox builder"
run = "uv run --python 3.13 python scripts/build-os-remote.py"

[tasks."os:camera:bundle"]
description = "Stage an immutable camera image bundle; pass --output NEW_DIRECTORY"
run = "uv run --python 3.13 python scripts/prepare-camera-image.py"

[tasks."os:remote:status"]
description = "Read the ShieldSigner build status on Beelink2 container 610"
run = "bash scripts/os-remote-status.sh"

[tasks."kicad:edit"]
description = "Apply an explicit JSON layout recipe with backup and edit audit"
run = "uv run scripts/pcb-edit.py"

[tasks."kicad:fab"]
description = "Require native checks, then export Gerbers and separate PTH/NPTH drills"
run = "uv run scripts/kicad.py fabricate"

[tasks."kicad:tools:check"]
description = "Verify editor acceptance, stale-recipe rejection and bad-placement rollback"
run = "uv run scripts/verify-pcb-editor.py"

[tasks."dev:source"]
description = "Preview editable TSX without imported copper on localhost:3022"
run = "bun run dev:source"

[tasks."os:prepare"]
description = "Prepare reviewed OS Rust-camera hooks and UR2 reader configuration; no compile or flash"
run = "SHIELDSIGNER_PREPARE_ONLY=1 bash scripts/build-os.sh"

[tasks."bom:check"]
description = "Verify fitted passive nominal values agree with their selected catalog parts"
run = "uv run scripts/check-bom-values.py"

[tasks."hardware:validate"]
description = "Check native ERC/DRC, four-layer geometry and eight-pin LCD interface; refresh board SVGs"
run = "uv run python scripts/check-lcd-module-variant.py"

[tasks."variant:lcd:check"]
description = "Compatibility alias for hardware:validate"
hide = true
run = "mise run hardware:validate"

[tasks."hardware:pinouts"]
description = "Audit all Luckfox/LCD pad nets, rail separation and pinned firmware assignments"
run = "uv run python scripts/audit-module-pinouts.py"

[tasks."variant:lcd:pinouts"]
description = "Compatibility alias for hardware:pinouts"
hide = true
run = "mise run hardware:pinouts"

[tasks."hardware:models"]
description = "Check manufacturer land patterns, mounting geometry and all portable 3D model hashes"
run = "uv run python scripts/check-modular-mechanics.py"

[tasks."variant:lcd:models"]
description = "Compatibility alias for hardware:models"
hide = true
run = "mise run hardware:models"

[tasks."variant:lcd:fab"]
description = "Compatibility alias for hardware:fab"
hide = true
run = "mise run hardware:fab"

[tasks."variant:lcd:review"]
description = "Compatibility alias for hardware:review"
hide = true
run = "mise run hardware:review"

[tasks."hardware:open"]
description = "Open the modular carrier in pinned KiCad 10"
run = "mise run kicad:open"

[tasks."variant:lcd:open"]
description = "Compatibility alias for hardware:open"
hide = true
run = "mise run hardware:open"

[tasks."variant:lcd:package"]
description = "Compatibility alias for hardware:package"
hide = true
run = "mise run hardware:package"

[tasks."variant:lcd:display-model"]
hide = true
description = "Regenerate drawing-based LCD/support envelopes and hashes; follow with review/package"
run = "uv run --python 3.11 --with cadquery==2.8.0 python scripts/model-pill-display.py"

[tasks."enclosure:build"]
description = "Render draft enclosure STL meshes and validate manifoldness, bed bounds and print Z"
run = "uv run --python 3.11 --with trimesh --with networkx --with manifold3d python enclosure/build.py"

[tasks."enclosure:fit"]
description = "Check native hardware against printed parts and export assembled/exploded GLBs (requires hardware mesh cache)"
run = ["uv run --python 3.11 --with trimesh --with networkx --with manifold3d python enclosure/check_hardware.py", "uv run --python 3.11 --with trimesh --with networkx --with manifold3d python enclosure/preview_assembly.py"]

[tasks."enclosure:verify"]
description = "Regenerate portable meshes, run fit/motion/fastener checks and slice the P1S plate"
run = "uv run --python 3.11 --with trimesh --with networkx --with manifold3d python enclosure/verify.py"

[tasks."enclosure:viewer"]
description = "Bundle the locally hosted Three.js enclosure viewer"
run = "bun build website/viewer/enclosure.js --outfile website/static/enclosure-viewer.js --minify"

[tasks."enclosure:hardware"]
description = "Generate checked hardware mesh caches from existing native STEP/GLB exports"
run = ["uv run --python 3.11 --with cadquery==2.8.0 --with trimesh python enclosure/export_hardware.py", "uv run --python 3.11 --with trimesh python enclosure/color_hardware.py"]

[tasks."telegram:sync"]
description = "Sync three configured Telegram groups into ignored private local storage"
run = "uv run tools/telegram/ingest.py"

[tasks."telegram:status"]
description = "Show private local Telegram message counts and last completed syncs"
run = "uv run python tools/telegram/status.py"

[tasks."telegram:index"]
description = "Build private full-text, topic and deduplicated source-link indexes"
run = "uv run python tools/telegram/knowledge.py build"

[tasks."telegram:search"]
description = "Search private Telegram knowledge with source references"
run = "uv run python tools/telegram/knowledge.py search"

[tasks."telegram:update"]
description = "Sequentially sync Telegram groups and rebuild the private knowledge index"
run = ["uv run tools/telegram/ingest.py", "uv run python tools/telegram/knowledge.py build"]

[tasks."bom:self-assembly"]
description = "Generate/check the separate DigiKey self-assembly sourcing overlay"
run = "uv run python scripts/generate-self-assembly.py"

[tasks."hardware:first-article"]
description = "Measure native QFN stencil/via geometry and report first-article assembly process questions"
run = "uv run python scripts/audit-first-article.py"

[tasks."variant:lcd:first-article"]
description = "Compatibility alias for hardware:first-article"
hide = true
run = "mise run hardware:first-article"

[tasks."bom:first-article-budget"]
description = "Calculate one-article/spares/three-board parts baskets; keep missing landed costs unknown"
run = "uv run python scripts/budget-first-article.py"

[tasks."variant:lcd:bottom-quote"]
hide = true
description = "Package an unsubmitted bottom-only first-article assembly option from pinned Gerbers and matched BOM/CPL"
run = "uv run python scripts/package-bottom-assembly.py"

[tasks."hardware:power-budget"]
description = "Calculate LCD LDO heat sensitivity and retain first-article measurement gates"
run = "uv run python scripts/lcd-power-budget.py"

[tasks."variant:lcd:power-budget"]
description = "Compatibility alias for hardware:power-budget"
hide = true
run = "mise run hardware:power-budget"

[tasks."hardware:fab-audit"]
description = "Screen actual native geometry against dated JLC fabrication limits and flag assembly tooling gaps"
run = "uv run python scripts/audit-fabrication.py"

[tasks."variant:lcd:fab-audit"]
description = "Compatibility alias for hardware:fab-audit"
hide = true
run = "mise run hardware:fab-audit"

[tasks."hardware:faces"]
description = "Render unobstructed high-resolution top and bottom PCB views"
run = "uv run python scripts/render-board-faces.py"

[tasks."variant:lcd:faces"]
description = "Compatibility alias for hardware:faces"
hide = true
run = "mise run hardware:faces"

[tasks."pcb:denver"]
description = "Recreate the attributed denver.space rear silkscreen from the pinned official logo"
run = "uv run --python 3.12 --with pillow==11.3.0 --with numpy==2.2.6 --with opencv-python-headless==4.12.0.88 --with mapbox-earcut==1.0.3 python scripts/add-denver-branding.py"

[tasks."pcb:artwork:test"]
description = "Verify the artwork-only audit rejects changes to electrical and mechanical PCB data"
run = "uv run python -m unittest discover -s scripts/tests -p test_pcb_artwork_audit.py"

[tasks."hardware:stack"]
description = "Measure exported header mating alignment, insertion and module stack geometry"
run = "uv run --python 3.11 --with trimesh --with numpy python scripts/audit-assembly-stack.py"

[tasks."variant:lcd:stack"]
description = "Compatibility alias for hardware:stack"
hide = true
run = "mise run hardware:stack"

[tasks."hardware:fit-model"]
description = "Export full case-aligned PCB STEP, standard-unit GLBs and assembled case STL fit kit"
run = "uv run --python 3.11 --with cadquery==2.8.0 --with trimesh --with manifold3d python scripts/build-fit-model.py"

[tasks."variant:lcd:fit-model"]
description = "Compatibility alias for hardware:fit-model"
hide = true
run = "mise run hardware:fit-model"

[tasks."hardware:printable-fit"]
description = "Create one watertight millimetre STL fit mockup and a bare carrier STL"
run = "uv run --python 3.11 --with trimesh --with manifold3d --with networkx python scripts/build-printable-fit.py"

[tasks."variant:lcd:printable-fit"]
description = "Compatibility alias for hardware:printable-fit"
hide = true
run = "mise run hardware:printable-fit"

[tasks."variant:lcd:pwm"]
hide = true
description = "Build the dedicated-backlight PWM revision candidate and run native checks"
run = "uv run python scripts/build-backlight-pwm.py"

[tasks."hardware:pinout-diagram"]
description = "Check public Mini pin diagram against both native revisions, pinned SDK muxes and app"
run = "uv run python scripts/audit-pinout-diagram.py"

[tasks."variant:lcd:pinout-diagram"]
description = "Compatibility alias for hardware:pinout-diagram"
hide = true
run = "mise run hardware:pinout-diagram"

[tasks."camera:re:prepare"]
description = "Fetch and verify pinned RKAIQ binaries and Ghidra; build Mac native decompiler if needed"
run = "uv run python reverse-engineering/rkaiq/scripts/prepare.py --ghidra"

[tasks."camera:re:analyze"]
description = "Analyze pinned ARM binaries with Ghidra and export selected numerical/daemon pseudocode"
run = "uv run python reverse-engineering/rkaiq/scripts/analyze.py"

[tasks."camera:rust:test"]
description = "Test Rust reconstruction and compare original ARM instructions with 9,050 Rust outputs"
run = ["mise exec rust@1.93.1 -- cargo test --locked --manifest-path firmware/rkaiq-rs/Cargo.toml", "mise exec rust@1.93.1 -- cargo build --locked --release --manifest-path firmware/rkaiq-rs/Cargo.toml --bin numeric-fixture", "uv run --python 3.13 --with pyelftools==0.32 --with unicorn==2.1.4 python reverse-engineering/rkaiq/scripts/differential.py --cases 1000 --emit-dir dist/reverse-engineering/fixtures"]

[tasks."camera:rust:arm"]
description = "Cross-compile standalone static ARMv7/musl camera and numerical test tools"
run = "mise exec rust@1.93.1 zig@0.15.2 -- uv run --python 3.13 --with cargo-zigbuild==0.23.0 cargo-zigbuild zigbuild --locked --release --target armv7-unknown-linux-musleabihf --manifest-path firmware/rkaiq-rs/Cargo.toml --bins"

[tasks."camera:rust:smoke"]
description = "Check static ARM tools and entire numerical corpus under Docker ARM emulation"
run = "uv run python reverse-engineering/rkaiq/scripts/arm-smoke.py"

[tasks."camera:rust:package"]
description = "Package verified ARM camera-test tools, original-reference fixtures, source and test guide"
run = ["mise run camera:rust:arm", "mise run camera:qr:native-build", "mise exec rust@1.93.1 -- cargo build --locked --release --manifest-path firmware/rkaiq-rs/Cargo.toml --bin frame-preview --bin camera-probe", "uv run --python 3.13 --with pyelftools==0.32 python reverse-engineering/rkaiq/scripts/package.py"]

[tasks."camera:release:preflight"]
description = "Check exact release binaries, source hashes and hardware evidence without freezing a kit"
run = "uv run --python 3.13 --with pyelftools==0.32 python reverse-engineering/rkaiq/scripts/release-preflight.py"

[tasks."camera:qr:fallback"]
description = "Check raw-first process-local QR retry contracts"
run = "uv run --python 3.13 --with pillow python firmware/rkaiq-rs/python/test_qr_fallback.py"

[tasks."camera:qr:native-build"]
description = "Build pinned QR-only static ARM ZXing benchmark with mise Zig"
run = "uv run --python 3.13 python reverse-engineering/rkaiq/scripts/build-qr-native-bench.py"

[tasks."camera:qr:quirc-build"]
description = "Build pinned static ARM quirc benchmarks, default and float"
run = "uv run --python 3.13 python reverse-engineering/rkaiq/scripts/build-quirc-native-bench.py"

[tasks."camera:rust:layout"]
description = "Cross-check ISP32 Rust layout against pinned ARM kernel UAPI"
run = "uv run --python 3.13 --with pyelftools==0.32 python reverse-engineering/rkaiq/scripts/check-layout.py"

[tasks."camera:rust:lifecycle"]
description = "Compare Rust service lifecycle against original ARM daemon event traces"
run = ["mise exec rust@1.93.1 -- cargo build --locked --release --manifest-path firmware/rkaiq-rs/Cargo.toml --bin numeric-fixture", "uv run --python 3.13 --with pyelftools==0.32 --with unicorn==2.1.4 python reverse-engineering/rkaiq/scripts/lifecycle.py --cases 100 --emit-dir dist/reverse-engineering/lifecycle-fixtures"]

[tasks."camera:rust:binding"]
description = "Compare Rust sensor selector against original ARM inventory lookup"
run = ["mise exec rust@1.93.1 -- cargo build --locked --release --manifest-path firmware/rkaiq-rs/Cargo.toml --bin numeric-fixture", "uv run --python 3.13 --with pyelftools==0.32 --with unicorn==2.1.4 python reverse-engineering/rkaiq/scripts/binding.py --cases 1000 --emit-dir dist/reverse-engineering/binding-fixtures"]

[tasks."camera:rust:statistics"]
description = "Compare Rust AWB measurement decoding against original ARM translator"
run = ["mise exec rust@1.93.1 -- cargo build --locked --release --manifest-path firmware/rkaiq-rs/Cargo.toml --bin numeric-fixture", "uv run --python 3.13 --with pyelftools==0.32 --with unicorn==2.1.4 python reverse-engineering/rkaiq/scripts/statistics.py --cases 100 --emit-dir dist/reverse-engineering/statistics-fixtures"]

[tasks."camera:rust:ae-grid"]
description = "Compare corrected AE0 grids and weighted means against original ARM helper"
run = ["mise exec rust@1.93.1 -- cargo build --locked --release --manifest-path firmware/rkaiq-rs/Cargo.toml --bin numeric-fixture", "uv run --python 3.13 --with pyelftools==0.32 --with unicorn==2.1.4 python reverse-engineering/rkaiq/scripts/ae-grid.py --cases 1000 --emit-dir dist/reverse-engineering/ae-grid-fixtures"]

[tasks."camera:rust:ae-histogram"]
description = "Compare 64/256-bin AE histogram correction against original ARM helper"
run = ["mise exec rust@1.93.1 -- cargo build --locked --release --manifest-path firmware/rkaiq-rs/Cargo.toml --bin numeric-fixture", "uv run --python 3.13 --with pyelftools==0.32 --with unicorn==2.1.4 python reverse-engineering/rkaiq/scripts/ae-histogram.py --cases 1000 --emit-dir dist/reverse-engineering/ae-histogram-fixtures"]

[tasks."camera:rust:ae-big-grid"]
description = "Compare 15x15 AE grids and subwindow sums against original ARM helper"
run = ["mise exec rust@1.93.1 -- cargo build --locked --release --manifest-path firmware/rkaiq-rs/Cargo.toml --bin numeric-fixture", "uv run --python 3.13 --with pyelftools==0.32 --with unicorn==2.1.4 python reverse-engineering/rkaiq/scripts/ae-big-grid.py --cases 1000 --emit-dir dist/reverse-engineering/ae-big-grid-fixtures"]

[tasks."camera:rust:sensor-linear"]
description = "Compare linear sensor-write sequencing and failures against original ARM method"
run = ["mise exec rust@1.93.1 -- cargo build --locked --release --manifest-path firmware/rkaiq-rs/Cargo.toml --bin numeric-fixture", "uv run --python 3.13 --with pyelftools==0.32 --with unicorn==2.1.4 python reverse-engineering/rkaiq/scripts/sensor-linear.py --cases 1000 --emit-dir dist/reverse-engineering/sensor-linear-fixtures"]

[tasks."camera:rust:exposure"]
description = "Compare gain/shutter register conversion with original RKAIQ and uClibc ARM code"
run = ["mise exec rust@1.93.1 -- cargo build --locked --release --manifest-path firmware/rkaiq-rs/Cargo.toml --bin numeric-fixture", "uv run --python 3.13 --with pyelftools==0.32 --with unicorn==2.1.4 python reverse-engineering/rkaiq/scripts/exposure.py --cases 1000 --emit-dir dist/reverse-engineering/exposure-fixtures"]

[tasks."camera:rust:sensor-descriptor"]
description = "Compare sensor descriptor construction and query fallbacks with original ARM methods"
run = ["mise exec rust@1.93.1 -- cargo build --locked --release --manifest-path firmware/rkaiq-rs/Cargo.toml --bin numeric-fixture", "uv run --python 3.13 --with pyelftools==0.32 --with unicorn==2.1.4 python reverse-engineering/rkaiq/scripts/sensor-descriptor.py --cases 1000 --emit-dir dist/reverse-engineering/sensor-descriptor-fixtures"]

[tasks."camera:rust:iq-calibration"]
description = "Validate SDK IQ exposure loading, native conversion and offline planner input checks"
run = ["mise exec rust@1.93.1 -- cargo build --locked --release --manifest-path firmware/rkaiq-rs/Cargo.toml --bin numeric-fixture --bin camera-probe", "uv run --python 3.13 --with pyelftools==0.32 --with unicorn==2.1.4 python reverse-engineering/rkaiq/scripts/iq-calibration.py --cases 100 --emit-dir dist/reverse-engineering/iq-calibration-fixtures", "uv run --python 3.13 python reverse-engineering/rkaiq/scripts/iq-plan-check.py"]

[tasks."camera:rust:ae-decision"]
description = "Compare histogram AE exposure solving with the original ARM ClmExecute"
run = ["mise exec rust@1.93.1 -- cargo build --locked --release --manifest-path firmware/rkaiq-rs/Cargo.toml --bin numeric-fixture", "uv run --python 3.13 --with pyelftools==0.32 --with unicorn==2.1.4 python reverse-engineering/rkaiq/scripts/ae-decision.py --cases 1000 --emit-dir dist/reverse-engineering/ae-decision-fixtures"]

[tasks."camera:rust:ae-damping"]
