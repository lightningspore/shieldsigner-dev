<p class="caption">{{ guides|length }} guide{{ guides|length|pluralize }}{% if query %} matching “{{ query }}”{% endif %}</p><div class="cards">{% for guide in guides %}<a class="card" href="/guides/{{ guide.slug }}/"><span class="eyebrow">{{ guide.category }}</span><h2>{{ guide.title }}</h2><p>{{ guide.description }}</p><span class="card-arrow">↗</span></a>{% empty %}<p>No matching guides. Try a component number or another term.</p>{% endfor %}</div>
