[package]
name = "shieldsigner-rkaiq"
version = "0.0.39-dev"
edition = "2021"
publish = false

[lib]
name = "shieldsigner_rkaiq"

[features]
default = ["diagnostics"]
diagnostics = ["profiles", "serde_json/std", "dep:libc"]
profiles = ["dep:serde_json"]

[[bin]]
name = "camera-probe"
path = "src/bin/camera-probe.rs"
required-features = ["diagnostics"]

[[bin]]
name = "numeric-fixture"
path = "src/bin/numeric-fixture.rs"
required-features = ["diagnostics"]

[[bin]]
name = "frame-preview"
path = "src/bin/frame-preview.rs"
required-features = ["diagnostics"]

[dependencies]
libm = "=0.2.16"
serde_json = { version = "1", optional = true, default-features = false, features = ["alloc"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
panic = "abort"
