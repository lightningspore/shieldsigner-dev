name: shieldsigner
services:
  web:
    image: shieldsigner:${SHIELDSIGNER_RELEASE:?Set the content release hash}
    build: .
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /data, /config]
    user: "1000:1000"
    mem_limit: 64m
    cpus: 0.5
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [edge]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
  shieldsigner-caddy:
    image: caddy:2.11.3-alpine
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    ports: ["127.0.0.1:8082:80"]
    volumes: ["./Caddyfile.vm:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    networks: [edge]
  cloudflared:
    image: cloudflare/cloudflared:2026.8.3
    profiles: [tunnel]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [tunnel, --no-autoupdate, run, --token-file, /run/secrets/tunnel-token]
    volumes: ["/opt/shieldsigner/secrets/tunnel-token:/run/secrets/tunnel-token:ro"]
    networks: [edge]
networks:
  edge:
volumes:
  caddy_data:
  caddy_config:
