[tasks."camera:rust:awb-translation"]
description = "Compare full RV1106 AWB translation and SDK configuration metadata against original ARM"
run = ["mise exec rust@1.93.1 -- cargo build --locked --release --manifest-path firmware/rkaiq-rs/Cargo.toml --bin numeric-fixture", "uv run --python 3.13 --with pyelftools==0.32 --with unicorn==2.1.4 python reverse-engineering/rkaiq/scripts/awb-translation.py --cases 1000 --emit-dir dist/reverse-engineering/awb-translation-fixtures"]

